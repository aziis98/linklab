[project]
name = "kinematics"
version = "0.1.0"
description = "Objects with reduced rigid motions, assembly constraints, and free-motion (tangent space) analysis."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
]

[project.scripts]
four-bar = "kinematics.examples.four_bar:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kinematics"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
