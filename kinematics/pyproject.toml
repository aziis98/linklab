[project]
name = "kinematics"
version = "0.1.0"
description = "Objects with reduced rigid motions, assembly constraints, and free-motion (tangent space) analysis."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "sympy>=1.14",
]

[project.optional-dependencies]
render = ["matplotlib>=3.9"]
browser = ["playwright>=1.50"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kinematics"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.14"]

[tool.pytest.ini_options]
testpaths = ["tests"]
